[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "apiwatch"
version = "0.1.0"
description = "A lightweight Python toolkit for API monitoring, testing, validation, and reporting"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    { name = "Pranav Khatavkar" }
]

keywords = [
    "api",
    "monitoring",
    "testing",
    "python",
    "rest-api",
    "http",
    "async",
    "validation",
    "performance"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2"
]


[project.scripts]
apiwatch = "apiwatch.cli:main"


[project.optional-dependencies]

validation = [
    "jsonschema>=4"
]

dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
    "twine"
]


[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/APIWatch"
Repository = "https://github.com/YOUR_USERNAME/APIWatch"
Issues = "https://github.com/YOUR_USERNAME/APIWatch/issues"


[tool.hatch.build.targets.wheel]
packages = ["src/apiwatch"]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 88
target-version = "py310"